{% extends "base.html" %}

{% block title %}{{ ticker }} Price Chart{% endblock %}

{% block extra_head %}
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="fw-bold">{{ ticker }}</h1>
  <a href="{% url 'stock_analysis:index' %}" class="btn btn-sm btn-outline-secondary">← All tickers</a>
</div>

<div class="card shadow-sm p-3">
  <canvas id="priceChart" height="100"></canvas>
</div>
{% endblock %}

{% block extra_js %}
<script>
  const raw = {{ chart_json|safe }};
  const ctx = document.getElementById('priceChart').getContext('2d');
  new Chart(ctx, {
    type: 'line',
    data: {
      labels: raw.dates,
      datasets: [{
        label: '{{ ticker }} Close Price',
        data: raw.closes,
        borderColor: 'rgba(13, 110, 253, 0.9)',
        backgroundColor: 'rgba(13, 110, 253, 0.08)',
        tension: 0.3,
        fill: true,
        pointRadius: 2,
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { maxTicksLimit: 10 } },
        y: { title: { display: true, text: 'Close Price (₹ / $)' } }
      }
    }
  });
</script>
{% endblock %}
