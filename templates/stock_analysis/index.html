{% extends "base.html" %}

{% block title %}Stock Analysis{% endblock %}

{% block content %}
<h1 class="fw-bold mb-2">Stock Analysis</h1>
<p class="text-muted mb-4">Select a ticker to see its price history.</p>

<div class="row g-3">
  {% for ticker in tickers %}
    <div class="col-6 col-sm-4 col-md-3 col-lg-2">
      <a href="{% url 'stock_analysis:detail' ticker %}"
         class="btn btn-outline-success w-100">{{ ticker }}</a>
    </div>
  {% empty %}
    <p class="text-muted fst-italic">No data found. Upload a <code>stocks.feather</code> file to <code>/data/</code>.</p>
  {% endfor %}
</div>
{% endblock %}
